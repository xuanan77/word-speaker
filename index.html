<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>单词发音</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f7fb;--card:#fff;--text:#1c1e26;--muted:#6b7080;--line:#e3e5ee;--accent:#3b6ef5;--accent-text:#fff;--danger:#d64545;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#14161c;--card:#1f222b;--text:#eceef5;--muted:#9096a8;--line:#2e3240;--accent:#6b93ff;--accent-text:#0b1020;--danger:#ff7b7b;}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161c;--card:#1f222b;--text:#eceef5;--muted:#9096a8;--line:#2e3240;--accent:#6b93ff;--accent-text:#0b1020;--danger:#ff7b7b;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 16px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);outline:none}
input[type=text]:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
.primary{background:var(--accent);color:var(--accent-text);padding:0 18px;font-weight:600;font-size:16px}
.primary:active{opacity:.8}
.msg{min-height:20px;margin:8px 2px 0;font-size:13px;color:var(--muted)}
.msg.err{color:var(--danger)}
.opts{display:flex;align-items:center;gap:8px;margin:6px 2px 0;font-size:13px;color:var(--muted)}
select{font:inherit;font-size:13px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
h2{font-size:15px;margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.clear{background:none;color:var(--muted);font-size:13px;padding:4px 6px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .w{flex:1;text-align:left;background:none;color:var(--text);padding:14px 16px;font-size:17px;display:flex;align-items:center;gap:10px;border-radius:0}
li .w:active{background:var(--bg)}
li .del{background:none;color:var(--muted);padding:14px 16px;font-size:18px;border-radius:0}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>🔊 单词发音</h1>
  <div class="row">
    <input id="inp" type="text" placeholder="输入英文单词" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <button id="go" class="primary">发音</button>
  </div>
  <div class="opts">口音：
    <select id="acc"><option value="en-US">美音</option><option value="en-GB">英音</option></select>
  </div>
  <div id="msg" class="msg"></div>
  <h2><span>已保存的单词（点击朗读）</span><button id="clr" class="clear">清空</button></h2>
  <ul id="list"></ul>
</main>
<script>
(function(){
  var KEY="word-speaker:words", ACC="word-speaker:accent";
  var inp=document.getElementById("inp"), go=document.getElementById("go"),
      list=document.getElementById("list"), msg=document.getElementById("msg"),
      acc=document.getElementById("acc"), clr=document.getElementById("clr");
  var words=[], voices=[];
  var RE=/^[A-Za-z][A-Za-z'\- ]*$/;

  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} persistHook()}
  words=load(KEY,[]); if(!Array.isArray(words)) words=[];
  var savedAcc=load(ACC,"en-US"); if(savedAcc==="en-GB"||savedAcc==="en-US") acc.value=savedAcc;

  /* 账号级云端保存：换设备、清缓存、退出后再打开都还在；不可用时退回浏览器本地存储 */
  var dbDoc=null, chain=Promise.resolve();
  function persistHook(){
    if(!dbDoc) return;
    var snapshot={list:words.slice(),accent:acc.value};
    chain=chain.then(function(){return dbDoc.set(snapshot)}).catch(function(){});
  }
  (async function(){
    try{
      if(!(window.claude&&claude.use)) return;
      var db=await claude.use("db"), user=await claude.use("user");
      if(!db||!user) return;
      var id=await user.id(); if(!id) return;
      var ref=db.doc("data/users/"+id+"/state/words");
      var snap=await ref.get();
      var remote=snap.exists?snap.data():null;
      var rl=(remote&&Array.isArray(remote.list))?remote.list.filter(function(x){return typeof x==="string"&&RE.test(x)}):[];
      var merged=rl.slice();
      words.forEach(function(w){if(merged.indexOf(w)<0)merged.push(w)});
      words=merged;
      if(remote&&(remote.accent==="en-GB"||remote.accent==="en-US")) acc.value=remote.accent;
      dbDoc=ref;
      save(KEY,words); render();
    }catch(e){}
  })();

  function say(t,err){msg.textContent=t||"";msg.className="msg"+(err?" err":"")}

  function refreshVoices(){ if("speechSynthesis" in window) voices=speechSynthesis.getVoices(); }
  if("speechSynthesis" in window){ refreshVoices(); speechSynthesis.onvoiceschanged=refreshVoices; }

  function speak(w){
    if(!("speechSynthesis" in window)){say("当前浏览器不支持语音朗读，请换用 Chrome / Edge / Safari",true);return}
    var lang=acc.value, u=new SpeechSynthesisUtterance(w);
    u.lang=lang; u.rate=0.9;
    var v=voices.filter(function(x){return x.lang.replace("_","-")===lang})[0]
       || voices.filter(function(x){return x.lang.toLowerCase().indexOf("en")===0})[0];
    if(v) u.voice=v;
    u.onstart=function(){say("正在朗读："+w)};
    u.onend=function(){say("")};
    u.onerror=function(){say("朗读失败，请检查系统是否安装了英文语音",true)};
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  function render(){
    list.innerHTML="";
    if(!words.length){
      var e=document.createElement("li");e.className="empty";e.textContent="还没有单词，输入后点“发音”即可保存";list.appendChild(e);return;
    }
    words.slice().reverse().forEach(function(w){
      var li=document.createElement("li");
      var b=document.createElement("button");b.className="w";b.textContent="🔈 "+w;
      b.onclick=function(){speak(w)};
      var d=document.createElement("button");d.className="del";d.textContent="✕";d.setAttribute("aria-label","删除 "+w);
      d.onclick=function(){words=words.filter(function(x){return x!==w});save(KEY,words);render()};
      li.appendChild(b);li.appendChild(d);list.appendChild(li);
    });
  }

  function submit(){
    var w=inp.value.trim().toLowerCase();
    if(!w) return;
    if(!RE.test(w)){say("请输入英文单词",true);return}
    if(words.indexOf(w)<0){words.push(w);save(KEY,words);render()}
    inp.value="";
    speak(w);
  }

  go.onclick=submit;
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")submit()});
  acc.onchange=function(){save(ACC,acc.value)};
  clr.onclick=function(){if(words.length&&confirm("清空所有单词？")){words=[];save(KEY,words);render()}};
  render();
})();
</script>
</body>
</html>
